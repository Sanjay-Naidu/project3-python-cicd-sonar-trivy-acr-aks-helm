# =============================================================================
# Project : Project 3 - Python App CI/CD on Azure AKS
# Author  : Sanjay Naidu
# File    : sonar-project.properties - SonarCloud analysis configuration
# =============================================================================
# WHY SonarCloud (not self-hosted SonarQube): SonarCloud is free for public
# repos, while self-hosting SonarQube needs a VM/container running 24x7
# (~$30+/month) - an easy cost win with identical analysis capability.
#
# Fill these two values after creating the project on https://sonarcloud.io
# (see docs/SETUP.md, Phase 4):

# These are SonarCloud's default keys for a GitHub-linked personal account -
# VERIFY both against the values shown in the SonarCloud UI after importing
# the repo (Project Information panel on the project page).
sonar.projectKey=Sanjay-Naidu_project3-python-cicd-sonar-trivy-acr-aks-helm
sonar.organization=sanjay-naidu

sonar.projectName=Project 3 - Python CI/CD on AKS
sonar.projectVersion=0.1.0

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12

# Coverage report produced by pytest in CI (pytest --cov --cov-report=xml)
sonar.python.coverage.reportPaths=coverage.xml

# Infra and chart files are analysed by Trivy, not Sonar
sonar.exclusions=helm/**,terraform/**,docs/**
