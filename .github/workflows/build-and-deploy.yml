# =============================================================================
# Project : Project 3 - Python App CI/CD on Azure AKS
# Author  : Sanjay Naidu
# File    : .github/workflows/build-and-deploy.yml - main CD pipeline
# =============================================================================
# Flow on every merge to main:
#   quality -> build + trivy scan + push to ACR -> deploy DEV (auto)
#           -> deploy PROD (manual approval via the 'prod' GitHub environment)
#
# Auth design: azure/login uses OIDC federation - GitHub proves its identity
# to Entra ID with a short-lived token. NO Azure password/secret is stored in
# GitHub. The same applies inside the cluster: AKS pulls from ACR with its
# managed identity, so there are no imagePullSecrets either.

name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "terraform/**" # infra changes go through terraform.yml instead
      - ".github/workflows/terraform.yml"
  workflow_dispatch: {} # manual re-run button

# One pipeline at a time; never cancel a running deployment mid-flight.
concurrency:
  group: build-deploy-main
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC federation with Azure
  contents: read
  security-events: write

env:
  IMAGE_NAME: python-app

jobs:
  quality:
    name: Code quality
    uses: ./.github/workflows/reusable-quality.yml
    secrets: inherit

  build-and-push:
    name: Build, scan, push to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Immutable tag from the commit SHA: every image maps 1:1 to a commit,
      # which makes "what is running in prod?" answerable and rollbacks exact.
      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            -t ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} .

      # Gate BEFORE push: a vulnerable image never reaches the registry.
      - name: Trivy image scan (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Azure login (OIDC - no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          docker push ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      # --atomic: if the release does not become healthy in time, Helm
      # automatically rolls back to the previous revision - failed deploys
      # never leave dev (or prod) in a broken half-state.
      - name: Helm deploy (dev namespace)
        run: |
          helm upgrade --install python-app ./helm/python-app \
            --namespace dev --create-namespace \
            -f ./helm/python-app/values-dev.yaml \
            --set image.repository=${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --atomic --timeout 5m

      - name: Smoke test (helm test)
        run: helm test python-app -n dev --logs

  deploy-prod:
    name: Deploy to PROD (requires approval)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-push, deploy-dev]
    # The 'prod' GitHub environment is configured with a required reviewer
    # (you) - the pipeline PAUSES here until manually approved. This is the
    # promotion gate: the EXACT image verified in dev goes to prod.
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Helm deploy (prod namespace)
        run: |
          helm upgrade --install python-app ./helm/python-app \
            --namespace prod --create-namespace \
            -f ./helm/python-app/values-prod.yaml \
            --set image.repository=${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --atomic --timeout 5m

      - name: Smoke test (helm test)
        run: helm test python-app -n prod --logs

      - name: Show public endpoint
        run: |
          echo "Prod ingress public IP:"
          kubectl -n app-routing-system get svc nginx \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' || true
          echo ""
          kubectl -n prod get pods,svc,ingress
