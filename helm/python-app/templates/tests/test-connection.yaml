# Smoke test run by `helm test` (the CD pipeline runs it after every deploy):
# spins up a throwaway pod that must get a 200 from /healthz via the Service.
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "python-app.fullname" . }}-test-connection"
  labels:
    {{- include "python-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # NOT hook-succeeded: deleting the pod immediately on success races
    # `helm test --logs`, which reads the pod's log AFTER it completes -
    # hit this exact race in CI ("pods ... not found"). Leaving the pod
    # until the next test run (before-hook-creation) makes both the CLI
    # log read and `kubectl logs` after the fact reliable.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: healthcheck
      image: busybox:1.36
      command: ["wget"]
      args:
        - "-qO-"
        - "--timeout=5"
        - "{{ include "python-app.fullname" . }}:{{ .Values.service.port }}/healthz"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
