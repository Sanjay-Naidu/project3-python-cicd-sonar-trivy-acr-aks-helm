# Zero-trust ingress: only the managed nginx controller (app-routing-system
# namespace) and pods in the same namespace may reach the app.
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "python-app.fullname" . }}
  labels:
    {{- include "python-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "python-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-routing-system
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
